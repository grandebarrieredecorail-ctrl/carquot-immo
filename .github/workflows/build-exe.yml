name: Build Desktop App (.exe)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Package with Electron Builder
      run: |
        npm install --save-dev electron@latest electron-builder@latest
        npx electron-builder --win nsis --x64 -c.asar=false --publish never

    - name: Upload artifact (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: Carquot-Immo-Windows
        path: |
          dist/*.exe
          dist-electron/*.exe
          release/*.exe
